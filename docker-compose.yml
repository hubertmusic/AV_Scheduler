name: crew-call

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/crewcall?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_URL: ${PUBLIC_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-80}
      GUEST_LINK_HOURS: ${GUEST_LINK_HOURS:-4}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ACADEMY_URL: ${ACADEMY_URL:-}
      ACADEMY_SSO_SECRET: ${ACADEMY_SSO_SECRET:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8780}:80"
    depends_on:
      - api

volumes:
  mongo-data:
  uploads: # media, .pro files and guest uploads
