server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Media uploads are capped at 80 MB per file by the API; allow a little room for form overhead
  client_max_body_size 90m;

  # API and calendar feeds go to the Node service. Looking "api" up per request
  # (Docker's DNS) lets nginx start even while the API is still starting.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:4000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /cal/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Hashed build files can be cached forever
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # The app shell is never cached, so rebuilds show up right away (no service worker)
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    try_files $uri /index.html;
  }
}
